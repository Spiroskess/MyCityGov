<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="base :: layout(~{::title}, ~{::section})">

<title>Ραντεβού</title>

<section>
    <h1 class="mc-title">Ραντεβού</h1>

    <div style="display:flex; gap:12px; align-items:center; margin-top:16px; flex-wrap:wrap;">
        <a th:href="@{/citizen/booking}" class="mc-nav-link" style="text-decoration: underline;">
            + Νέο ραντεβού
        </a>
    </div>

    <table style="margin-top:18px; width:100%; border-collapse:collapse;">
        <thead>
        <tr style="text-align:left; border-bottom:1px solid #ddd;">
            <th style="padding:10px;">ID</th>
            <th style="padding:10px;">Υπηρεσία</th>
            <th style="padding:10px;">Ημερομηνία/Ώρα</th>
            <th style="padding:10px;">Κατάσταση</th>
            <th style="padding:10px;">Ενέργειες</th>
        </tr>
        </thead>

        <tbody>
        <tr th:if="${#lists.isEmpty(appointments)}">
            <td colspan="5" style="padding:12px; opacity:0.85;">
                Δεν έχεις ραντεβού ακόμη.
            </td>
        </tr>

        <tr th:each="a : ${appointments}" style="border-bottom:1px solid #eee;">
            <td style="padding:10px;" th:text="${a.id}">1</td>
            <td style="padding:10px;" th:text="${a.service}">KEP</td>
            <td style="padding:10px;"
                th:text="${a.appointmentDateTime != null ? #temporals.format(a.appointmentDateTime,'dd/MM/yyyy HH:mm') : '-'}">
                01/01/2025 10:00
            </td>
            <td style="padding:10px;">
                <span th:text="${a.status}" style="padding:4px 8px; border:1px solid #ccc; border-radius:999px;"></span>
            </td>

            <td style="padding:10px;">
                <!-- Αν έχεις endpoint cancel citizen -->
                <form th:if="${a.status != T(gr.hua.dit.mycitygov.core.service.model.AppointmentStatus).CANCELLED
                              and a.status != T(gr.hua.dit.mycitygov.core.service.model.AppointmentStatus).COMPLETED}"
                      th:action="@{'/citizen/appointments/' + ${a.id} + '/cancel'}"
                      method="post"
                      onsubmit="return confirm('Να ακυρωθεί το ραντεβού;');"
                      style="display:inline;">
                    <button type="submit" class="mc-btn" style="padding:8px 12px;">Ακύρωση</button>
                </form>

                <span th:if="${a.status == T(gr.hua.dit.mycitygov.core.service.model.AppointmentStatus).CANCELLED}"
                      style="opacity:0.7;">—</span>
            </td>
        </tr>
        </tbody>
    </table>
</section>

</html>
