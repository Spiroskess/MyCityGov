<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{base :: layout(~{::title}, ~{::section})}">

<title>Λεπτομέρειες αιτήματος</title>

<section>
    <h1 class="mc-title">Λεπτομέρειες αιτήματος</h1>

    <div class="mc-links-row">
        <a th:href="@{/citizen/requests}" class="mc-nav-link">← Πίσω στα αιτήματά μου</a>
    </div>

    <p><strong>Πρωτόκολλο:</strong> <span th:text="${r.protocolNumber()}"></span></p>
    <p><strong>Τύπος:</strong> <span th:text="${r.type()}"></span></p>
    <p><strong>Κατάσταση:</strong> <span th:text="${r.status()}"></span></p>

    <hr class="mc-sep"/>

    <p><strong>Θέμα:</strong></p>
    <p th:text="${r.subject()}">—</p>

    <p><strong>Περιγραφή:</strong></p>
    <div class="mc-prewrap" th:text="${r.description()}">—</div>

    <hr class="mc-sep mc-sep-spaced"/>

    <h3>Συνημμένα</h3>

    <div th:if="${#lists.isEmpty(attachments)}">— Δεν υπάρχουν συνημμένα.</div>

    <ul th:if="${!#lists.isEmpty(attachments)}" class="mc-attachments-list">
        <li th:each="a : ${attachments}" class="mc-attachments-item">
            <a th:href="@{/citizen/requests/{rid}/attachments/{aid}/download(rid=${r.id()},aid=${a.id()})}"
               th:text="${a.originalFilename()}"
               class="mc-attachment-link">αρχείο</a>

            <span class="mc-attachment-meta"
                  th:text="${' (' + a.sizeBytes() + ' bytes)'}"></span>
        </li>
    </ul>

    <hr class="mc-sep mc-sep-spaced"/>

    <h3>Μηνύματα από τον Δήμο</h3>

    <div th:if="${#lists.isEmpty(messages)}">— Δεν υπάρχουν μηνύματα ακόμα.</div>

    <div th:each="m : ${messages}" class="mc-message-card">
        <div class="mc-message-head">
            <strong th:text="${m.type()}">GENERAL</strong>
            <span class="mc-dot">•</span>
            <span th:text="${m.createdAt()}"></span>
        </div>
        <div class="mc-prewrap mc-message-body" th:text="${m.message()}"></div>
    </div>
</section>
</html>
