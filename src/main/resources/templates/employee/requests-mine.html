<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{base :: layout(~{::title}, ~{::section})}">

<title>Τα αιτήματά μου</title>

<section>
    <h1 class="mc-title">Τα αιτήματά μου</h1>

    <div style="display:flex; gap:14px; margin:12px 0 18px 0; flex-wrap:wrap;">
        <a th:href="@{/employee/requests-service}" class="mc-nav-link">Ουρά Υπηρεσίας</a>
        <a th:href="@{/employee/requests-mine}" class="mc-nav-link">Τα δικά μου</a>
    </div>

    <div th:if="${#lists.isEmpty(requests)}">
        Δεν έχεις αναλάβει κανένα αίτημα ακόμα.
    </div>

    <div th:if="${!#lists.isEmpty(requests)}">
        <table style="width:100%; border-collapse:collapse;">
            <thead>
            <tr style="text-align:left; border-bottom:1px solid rgba(255,255,255,0.25);">
                <th style="padding:10px 6px;">Πρωτόκολλο</th>
                <th style="padding:10px 6px;">Τύπος</th>
                <th style="padding:10px 6px;">Κατάσταση</th>
                <th style="padding:10px 6px;"></th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="r : ${requests}" style="border-bottom:1px solid rgba(255,255,255,0.12);">
                <td style="padding:10px 6px;" th:text="${r.protocolNumber()}">PR-0001</td>
                <td style="padding:10px 6px;" th:text="${r.type()}">TYPE</td>
                <td style="padding:10px 6px;" th:text="${r.status()}">STATUS</td>
                <td style="padding:10px 6px;">
                    <a class="mc-nav-button"
                       th:href="@{/employee/requests/{id}(id=${r.id()})}">
                        Πληροφορίες αιτήματος
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</section>
</html>
