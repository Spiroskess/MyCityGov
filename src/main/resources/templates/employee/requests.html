<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::title}, ~{::section})}">

<head>
    <title>Αιτήματα υπηρεσίας</title>
</head>

<body>
<section>
    <h2>Αιτήματα που μου έχουν ανατεθεί</h2>

    <table>
        <thead>
        <tr>
            <th>Πρωτόκολλο</th>
            <th>Πολίτης</th>
            <th>Τύπος</th>
            <th>Κατάσταση</th>
            <th>Ημ/νία</th>
            <th>Προθεσμία</th>
            <th>Ληξιπρόθεσμο;</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="r : ${requests}">
            <td th:text="${r.protocolNumber}">PR-0001</td>
            <td th:text="${r.citizenFullName}">Citizen Name</td>
            <td th:text="${r.type}">CERTIFICATE_RESIDENCE</td>
            <td th:text="${r.status}">IN_PROGRESS</td>
            <td th:text="${#temporals.format(r.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2025</td>
            <td th:text="${r.slaDueDate != null ? #temporals.format(r.slaDueDate, 'dd/MM/yyyy') : '-'}">10/01/2025</td>
            <td th:text="${r.overdue} ? 'ΝΑΙ' : 'ΟΧΙ'">ΟΧΙ</td>

            <!-- ΕΝΕΡΓΕΙΕΣ -->
            <td>

                <!-- RECEIVED -> IN_PROGRESS -->
                <form th:if="${r.status.name() == 'RECEIVED'}"
                      th:action="@{/employee/requests/status}"
                      method="post" style="display:inline;">
                    <input type="hidden" name="requestId" th:value="${r.id}" />
                    <input type="hidden" name="nextStatus" value="IN_PROGRESS" />
                    <button type="submit">Έναρξη</button>
                </form>

                <!-- IN_PROGRESS -> WAITING_ADDITIONAL_INFO -->
                <form th:if="${r.status.name() == 'IN_PROGRESS'}"
                      th:action="@{/employee/requests/status}"
                      method="post" style="display:inline;">
                    <input type="hidden" name="requestId" th:value="${r.id}" />
                    <input type="hidden" name="nextStatus" value="WAITING_ADDITIONAL_INFO" />
                    <input type="text" name="comment" placeholder="Τι λείπει;" maxlength="500"/>
                    <button type="submit">Ζήτα στοιχεία</button>
                </form>

                <!-- IN_PROGRESS -> COMPLETED -->
                <form th:if="${r.status.name() == 'IN_PROGRESS'}"
                      th:action="@{/employee/requests/status}"
                      method="post" style="display:inline;">
                    <input type="hidden" name="requestId" th:value="${r.id}" />
                    <input type="hidden" name="nextStatus" value="COMPLETED" />
                    <button type="submit">Ολοκλήρωση</button>
                </form>

                <!-- RECEIVED/IN_PROGRESS/WAITING -> REJECTED -->
                <form th:if="${r.status.name() == 'RECEIVED' or r.status.name() == 'IN_PROGRESS' or r.status.name() == 'WAITING_ADDITIONAL_INFO'}"
                      th:action="@{/employee/requests/status}"
                      method="post" style="display:inline;">
                    <input type="hidden" name="requestId" th:value="${r.id}" />
                    <input type="hidden" name="nextStatus" value="REJECTED" />
                    <input type="text" name="comment" placeholder="Αιτιολογία" maxlength="500"/>
                    <button type="submit">Απόρριψη</button>
                </form>

                <!-- WAITING_ADDITIONAL_INFO -> IN_PROGRESS -->
                <form th:if="${r.status.name() == 'WAITING_ADDITIONAL_INFO'}"
                      th:action="@{/employee/requests/status}"
                      method="post" style="display:inline;">
                    <input type="hidden" name="requestId" th:value="${r.id}" />
                    <input type="hidden" name="nextStatus" value="IN_PROGRESS" />
                    <button type="submit">Συνέχεια</button>
                </form>

            </td>
        </tr>

        </tbody>
    </table>
</section>
</body>
</html>
