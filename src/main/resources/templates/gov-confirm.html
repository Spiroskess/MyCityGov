<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::title}, ~{::section})}">

<head>
    <title>Gov Login • Επιβεβαίωση</title>
</head>

<body>
<section class="mc-auth-page">
    <div class="mc-auth-card mc-auth-card-centered">

        <div class="mc-auth-header">
            <span class="mc-auth-label">MOCK GOV</span>
            <h2>Επιβεβαίωση</h2>
            <p class="mc-auth-subtitle">
                Για επιβεβαίωση, βάλε τα τελευταία 4 ψηφία του ΑΜΚΑ σου.
            </p>
        </div>

        <p th:if="${param.error}" class="mc-alert mc-alert-error">
            Λάθος επιβεβαίωση. Δοκίμασε ξανά.
        </p>

        <form th:action="@{/gov-token-login/confirm}" method="post" class="mc-form">
            <div class="mc-form-group">
                <label for="amkaLast4">Τελευταία 4 ψηφία ΑΜΚΑ</label>
                <input id="amkaLast4" name="amkaLast4" required placeholder="π.χ. 0000"/>
            </div>

            <button type="submit" class="mc-button-primary mc-button-full">
                Επιβεβαίωση
            </button>


        </form>

        <div style="margin-top: 10px; text-align:center;">
            <a th:href="@{/gov-token-login}" class="mc-link-muted">Πίσω</a>
        </div>

    </div>
</section>
</body>
</html>
