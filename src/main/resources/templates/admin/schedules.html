<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::title}, ~{::section})}">

<title>Ωράρια Υπηρεσιών</title>

<section>
    <h1 class="mc-title">Ωράρια Υπηρεσιών</h1>

    <details style="margin-top:16px;">
        <summary style="cursor:pointer; font-weight:600;">+ Νέο ωράριο</summary>

        <div style="margin-top:12px; padding:12px; border:1px solid #ddd; border-radius:10px;">
            <form th:action="@{/admin/schedules}" th:object="${schedule}" method="post"
                  style="display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;">

                <div>
                    <label style="display:block; font-weight:600;">Υπηρεσία</label>
                    <select th:field="*{service}" required>
                        <option value="">-- Επιλογή --</option>
                        <option th:each="s : ${services}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>

                <div>
                    <label style="display:block; font-weight:600;">Ημέρα</label>
                    <select th:field="*{dayOfWeek}" required>
                        <option value="">-- Επιλογή --</option>
                        <option th:each="d : ${days}" th:value="${d}" th:text="${d}"></option>
                    </select>
                </div>

                <div>
                    <label style="display:block; font-weight:600;">Από</label>
                    <input type="time" th:field="*{startTime}" required/>
                </div>

                <div>
                    <label style="display:block; font-weight:600;">Έως</label>
                    <input type="time" th:field="*{endTime}" required/>
                </div>

                <div>
                    <label style="display:block; font-weight:600;">Slot (λεπτά)</label>
                    <input type="number" th:field="*{slotMinutes}" min="5" max="120" required/>
                </div>

                <button type="submit" class="mc-btn" style="padding:10px 14px;">
                    Αποθήκευση
                </button>
            </form>

            <p th:if="${error != null}" th:text="${error}"
               style="margin-top:10px; color:#b00020; font-weight:600;"></p>
        </div>
    </details>

    <table style="margin-top:18px; width:100%; border-collapse:collapse;">
        <thead>
        <tr style="text-align:left; border-bottom:1px solid #ddd;">
            <th style="padding:10px;">Υπηρεσία</th>
            <th style="padding:10px;">Ημέρα</th>
            <th style="padding:10px;">Από</th>
            <th style="padding:10px;">Έως</th>
            <th style="padding:10px;">Slot</th>
            <th style="padding:10px;">Ενέργειες</th>
        </tr>
        </thead>

        <tbody>
        <tr th:if="${#lists.isEmpty(schedules)}">
            <td colspan="6" style="padding:12px; opacity:0.85;">Δεν υπάρχουν ωράρια.</td>
        </tr>

        <tr th:each="s : ${schedules}" style="border-bottom:1px solid #eee;">
            <td style="padding:10px;" th:text="${s.service}"></td>
            <td style="padding:10px;" th:text="${s.dayOfWeek}"></td>
            <td style="padding:10px;" th:text="${s.startTime}"></td>
            <td style="padding:10px;" th:text="${s.endTime}"></td>
            <td style="padding:10px;" th:text="${s.slotMinutes} + ' λεπτά'"></td>
            <td style="padding:10px;">
                <form th:action="@{'/admin/schedules/' + ${s.id} + '/delete'}"
                      method="post"
                      onsubmit="return confirm('Να διαγραφεί το ωράριο;');"
                      style="display:inline;">
                    <button type="submit" class="mc-btn" style="padding:8px 12px;">Διαγραφή</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>

</html>
