<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::title}, ~{::section})}">

<head>
    <title>Ανάθεση αιτήματος</title>
</head>

<body>
<section>
    <h2>Ανάθεση Αιτήματος σε Υπηρεσία</h2>

    <p>Request ID: <strong th:text="${requestId}">1</strong></p>

    <form th:action="@{/admin/requests/{id}/assign(id=${requestId})}"
          th:object="${form}"
          method="post">

        <div th:if="${#fields.hasErrors('*')}">
            <p>Υπάρχουν σφάλματα στη φόρμα.</p>
        </div>

        <div>
            <label>Υπηρεσία</label>
            <select th:field="*{service}" required>
                <option value="">-- Επιλογή --</option>
                <option th:each="s : ${services}" th:value="${s}" th:text="${s}"></option>
            </select>
        </div>

        <div th:if="${#fields.hasErrors('service')}">
            <span th:errors="*{service}"></span>
        </div>

        <div style="margin-top:12px;">
            <a th:href="@{/admin/requests}">Πίσω</a>
            <button type="submit">Ανάθεση</button>
        </div>
    </form>
</section>
</body>

</html>
