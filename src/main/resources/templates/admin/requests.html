<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::title}, ~{::section})}">

<title>Όλα τα αιτήματα</title>

<section>
    <h1 class="mc-title">Διαχείριση Αιτημάτων</h1>

    <table style="margin-top:18px; width:100%; border-collapse:collapse;">
        <thead>
        <tr style="text-align:left; border-bottom:1px solid #ddd;">
            <th style="padding:10px;">Πρωτόκολλο</th>
            <th style="padding:10px;">Τύπος</th>
            <th style="padding:10px;">Κατάσταση</th>
            <th style="padding:10px;">Υπηρεσία</th>
            <th style="padding:10px;">Πολίτης</th>
            <th style="padding:10px;">Υπάλληλος</th>
            <th style="padding:10px;">SLA</th>
            <th style="padding:10px;">Ενέργειες</th>
        </tr>
        </thead>

        <tbody>
        <tr th:if="${#lists.isEmpty(requests)}">
            <td colspan="8" style="padding:12px; opacity:0.85;">Δεν υπάρχουν αιτήματα.</td>
        </tr>

        <tr th:each="r : ${requests}" style="border-bottom:1px solid #eee;">
            <td style="padding:10px;" th:text="${r.protocolNumber()}"></td>
            <td style="padding:10px;" th:text="${r.type()}"></td>
            <td style="padding:10px;" th:text="${r.status()}"></td>

            <td style="padding:10px;">
                <span th:if="${r.assignedService() != null}" th:text="${r.assignedService()}"></span>
                <span th:if="${r.assignedService() == null}">—</span>
            </td>

            <td style="padding:10px;" th:text="${r.citizenFullName()}"></td>

            <td style="padding:10px;">
                <span th:if="${r.assignedEmployeeFullName() != null}" th:text="${r.assignedEmployeeFullName()}"></span>
                <span th:if="${r.assignedEmployeeFullName() == null}">—</span>
            </td>

            <td style="padding:10px;">
                <span th:if="${r.slaDueDate() != null}" th:text="${r.slaDueDate()}"></span>
                <span th:if="${r.slaDueDate() == null}">—</span>
                <span th:if="${r.overdue()}" style="margin-left:8px; font-weight:600; color:#b00020;">Εκπρόθεσμο</span>
            </td>

            <td style="padding:10px;">
                <a th:href="@{/admin/requests/{id}/assign(id=${r.id()})}">
                    Ανάθεση σε υπηρεσία
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</section>

</html>
