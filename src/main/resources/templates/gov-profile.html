<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::title}, ~{::section})}">

<head>
    <title>Gov Login • Στοιχεία Πολίτη</title>
</head>

<body>
<section class="mc-auth-page">
    <div class="mc-auth-card mc-auth-card-centered">

        <div class="mc-auth-header">
            <span class="mc-auth-label">MOCK GOV</span>
            <h2>Στοιχεία Πολίτη</h2>
            <p class="mc-auth-subtitle">
                Τα στοιχεία προήλθαν από την mock υπηρεσία ταυτοποίησης.
            </p>
        </div>

        <div class="mc-form">
            <p><b>Ονοματεπώνυμο:</b>
                <span th:text="${c.firstName + ' ' + c.lastName}"></span>
            </p>
            <p><b>ΑΦΜ:</b> <span th:text="${c.afm}"></span></p>
            <p><b>ΑΜΚΑ:</b> <span th:text="${c.amka}"></span></p>
        </div>

        <!-- Κάνει login (session) και μπαίνει στην εφαρμογή -->
        <form th:action="@{/gov-token-login/enter}" method="post" style="margin-top: 14px;">
            <button type="submit" class="mc-button-primary mc-button-full">
                Συνέχεια – Είσοδος στην εφαρμογή
            </button>
        </form>

        <div style="margin: 14px 0; text-align:center;">
            <span style="opacity:.7;">ή</span>
        </div>

        <div>
            <a th:href="@{/gov-token-login}" class="mc-button-primary mc-button-full"
               style="text-decoration:none; display:block; text-align:center;">
                Νέα σύνδεση με Token
            </a>
        </div>

        <div style="margin-top: 10px; text-align:center;">
            <a th:href="@{/}" class="mc-link-muted">Πίσω στην αρχική</a>
        </div>

    </div>
</section>
</body>
</html>
