spring:
  application:
    name: mock-gov-service

server:
  port: ${SERVER_PORT:8091}

mockgov:
  # token που θα στέλνει το MyCityGov ως Authorization: Bearer <clientToken>
  client-token: ${MOCKGOV_CLIENT_TOKEN:mycitygov-client-token}

  # secret για HMAC υπογραφή του userToken
  hmac-secret: ${MOCKGOV_HMAC_SECRET:mycitygov-mockgov-secret}

  # διάρκεια ζωής userToken
  token-ttl-minutes: ${MOCKGOV_TOKEN_TTL_MINUTES:30}
