<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="base :: layout(~{::title}, ~{::section})">

<title>Ραντεβού</title>

<section>
    <h1 class="mc-title">Ραντεβού</h1>

    <div style="display:flex; gap:12px; align-items:center; margin-top:16px; flex-wrap:wrap;">
        <a th:href="@{/citizen/booking}" class="mc-button">
            + Νέο ραντεβού
        </a>


        <!-- αν θες να κρατήσεις το test endpoint -->
        <a th:href="@{/appointments/test-create}" class="mc-nav-link" style="text-decoration:underline;">
            + Δημιούργησε test ραντεβού
        </a>
    </div>

    <table class="mc-table" style="margin-top:18px; width:100%;">
        <thead>
        <tr>
            <th>ID</th>
            <th>Υπηρεσία</th>
            <th>Ημερομηνία</th>
            <th>Status</th>
            <th>Citizen</th>
            <th>Employee</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="a : ${appointments}">
            <td th:text="${a.id}">1</td>

            <td th:text="${a.service}">KEP</td>

            <td th:text="${#temporals.format(a.appointmentDateTime, 'dd/MM/yyyy HH:mm')}">
                01/01/2025 10:00
            </td>

            <td th:text="${a.status}">REQUESTED</td>

            <td th:text="${a.citizenId}">1</td>

            <td th:text="${a.employeeId}">-</td>
        </tr>

        <tr th:if="${appointments == null or appointments.isEmpty()}">
            <td colspan="6">Δεν υπάρχουν ραντεβού</td>
        </tr>
        </tbody>
    </table>
</section>

</html>
